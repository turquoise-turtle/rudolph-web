<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Rudolph</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/machines">Rudolph</a>
  <nav>
    <a href="/machines"{{if eq .Nav "machines"}} aria-current="page"{{end}}>Machines</a>
    <a href="/rules"{{if eq .Nav "rules"}} aria-current="page"{{end}}>Rules</a>
    <a href="/events"{{if eq .Nav "events"}} aria-current="page"{{end}}>Events</a>
    <a href="/events/top-blocked"{{if eq .Nav "top-blocked"}} aria-current="page"{{end}}>Top blocked</a>
    <a href="/events/top-allowed"{{if eq .Nav "top-allowed"}} aria-current="page"{{end}}>Top allowed</a>
    {{if .IsAdmin}}<a href="/admin"{{if eq .Nav "admin"}} aria-current="page"{{end}}>Admin</a>{{end}}
  </nav>
  {{if .User.Subject}}
  <div class="user">
    <span title="{{.User.Username}}">{{.User.Name}}</span>
    <form method="post" action="/auth/logout"><button type="submit">Sign out</button></form>
  </div>
  {{end}}
</header>
<main>
<h1>{{.Title}}</h1>
{{template "content" .Page}}
</main>
</body>
</html>
{{define "pager"}}
<nav class="pager">
  {{with .First}}<a href="{{.}}">First page</a>{{end}}
  {{with .Next}}<a rel="next" href="{{.}}">Next page</a>{{end}}
</nav>
{{end}}
